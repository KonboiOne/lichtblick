approvedGitRepositories:
  - "github.com/lichtblick-suite/*"

changesetBaseRefs:
  - main
  - origin/main

compressionLevel: mixed

defaultSemverRangePrefix: ""

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# braces GHSA-vfj7-8cjw-p6xm: disputed, no fix planned (https://github.com/micromatch/braces/issues/85)
npmAuditIgnoreAdvisories:
  - "1240992"
  # picomatch GHSA-fc5q-39xc-vjpf affects tooling globs from trusted repository config.
  # No fixed release is available; remove this exception when an upstream fix ships.
  - "1247710"

patchFolder: ./patches

yarnPath: .yarn/yarn-wrapper.js
