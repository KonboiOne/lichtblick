name: Cloudflare Pages

on:
  pull_request: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # This publishes the upstream website, whose credentials are not available in maintained forks.
    if: github.repository == 'lichtblick-suite/lichtblick'
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    env:
      # Environment variables that are injected into the build
      ENABLE_EXPERIMENTAL_COREPACK: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn web:build:prod

      - name: vercel-cloudflare compatibility
        run: |
          cp web/.cloudflare/* web/.webpack/

      - uses: cloudflare/pages-action@v1.5.0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.LICHTBLICKBOT_GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}
          projectName: lichtblick-suite-oss
          directory: web/.webpack
